<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="t d">
  <title id="t">Loop Engineering</title>
  <desc id="d">At 09:15 launchd runs loop-run.sh: /loop-triage routes tasks and picks up to two, then each picked task gets its own herdr session running /loop-work, which builds, gets a read-only loop-reviewer pass, fixes the findings and opens a Draft MR. At 09:30 loop-summary shows the result. You then verify the MR and run the gates: /loop-e2e, /merge-approved.</desc>
  <style>
    /* Hallmark · component: figure · genre: modern-minimal · theme: console (matches banner.svg) · console: graphite · signature: the daily run as a timed trail · v2.0.0 */
    /* critique: cool for the clock and the scheduler, amber only for the gates a person runs */
    svg {
      --color-paper: oklch(17% 0.008 250); --color-paper-2: oklch(21% 0.009 250); --color-paper-3: oklch(13.5% 0.007 250);
      --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(83% 0.008 250); --color-muted: oklch(71% 0.01 250);
      --color-rule: oklch(31% 0.01 250); --color-rule-2: oklch(42% 0.012 250);
      --color-accent: oklch(82% 0.15 80); --color-cool: oklch(77% 0.12 245);
      --font-display: "Host Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-outlier: "Atkinson Hyperlegible Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .ground { fill: var(--color-paper-2); stroke: var(--color-rule); stroke-width: 1; }
    .well { fill: var(--color-paper-3); }
    .rule { fill: none; stroke: var(--color-rule); stroke-width: 1; }
    .spine { fill: none; stroke: var(--color-rule-2); stroke-width: 1; }
    .label { fill: var(--color-muted); font: 500 16px var(--font-display); }
    .time { fill: var(--color-cool); font: 500 17px var(--font-outlier); }
    .cmd { fill: var(--color-ink); font: 400 18px var(--font-outlier); }
    .role { fill: var(--color-ink-2); font: 400 18px var(--font-display); }
    .gate { fill: var(--color-accent); font: 500 18px var(--font-outlier); }
    .note { fill: var(--color-muted); font: 400 18px var(--font-display); }
  </style>

  <rect class="ground" x="0.5" y="0.5" width="1199" height="551" rx="10"/>
  <text class="label" x="56" y="44">When</text>
  <text class="label" x="200" y="44">Runs</text>
  <text class="label" x="640" y="44">Does</text>
  <path class="rule" d="M0 68.5H1200"/>

  <path class="spine" d="M168 68V452"/>

  <text class="time" x="56" y="115">09:15</text>
  <text class="cmd" x="200" y="115">launchd: loop-run.sh</text>
  <text class="role" x="640" y="115">Starts the run</text>
  <path class="rule" d="M184 132.5H1200"/>

  <text class="cmd" x="200" y="179">/loop-triage</text>
  <text class="role" x="640" y="179">Coordinator routes tasks, picks up to two</text>
  <path class="rule" d="M184 196.5H1200"/>

  <text class="cmd" x="200" y="243">herdr: /loop-work</text>
  <text class="role" x="640" y="243">One Worker session per task builds it</text>
  <path class="rule" d="M184 260.5H1200"/>

  <text class="cmd" x="200" y="307">loop-reviewer</text>
  <text class="role" x="640" y="307">Reviewer reads the diff, read-only</text>
  <path class="rule" d="M184 324.5H1200"/>

  <text class="cmd" x="200" y="371">Draft MR</text>
  <text class="role" x="640" y="371">Worker fixes findings, hands off in Workspace</text>
  <path class="rule" d="M184 388.5H1200"/>

  <text class="time" x="56" y="435">09:30</text>
  <text class="cmd" x="200" y="435">loop-summary</text>
  <text class="role" x="640" y="435">Shows what the run did</text>

  <path class="well" d="M1 476H1199V542a9 9 0 0 1-9 9H10a9 9 0 0 1-9-9Z"/>
  <path class="rule" d="M0 475.5H1200"/>
  <text class="note" x="56" y="520">Then you run</text>
  <text class="gate" x="200" y="520">/loop-e2e</text>
  <text class="gate" x="370" y="520">/merge-approved</text>
</svg>
