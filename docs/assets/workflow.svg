<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="t d">
  <title id="t">Daily workflow</title>
  <desc id="d">Six steps: pick up a ticket with /pstack:teach, shape the change with superpowers:brainstorming and mattpocock-skills:grilling, build with /mattpocock-skills:tdd, check in a browser with /e2e, clean up with /review-branch, open the MR with /open-mr. /ship-branch runs the last three as gated steps.</desc>
  <style>
    /* Hallmark · component: figure · genre: modern-minimal · theme: console (matches banner.svg) · console: graphite · signature: the workflow as a trail · v2.0.0 */
    /* critique: a trail on one spine, cool numbers for order, amber only on the shortcut a person runs */
    svg {
      --color-paper: oklch(17% 0.008 250); --color-paper-2: oklch(21% 0.009 250); --color-paper-3: oklch(13.5% 0.007 250);
      --color-ink: oklch(95% 0.005 250); --color-ink-2: oklch(83% 0.008 250); --color-muted: oklch(71% 0.01 250);
      --color-rule: oklch(31% 0.01 250); --color-rule-2: oklch(42% 0.012 250);
      --color-accent: oklch(82% 0.15 80); --color-cool: oklch(77% 0.12 245);
      --font-display: "Host Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --font-outlier: "Atkinson Hyperlegible Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .ground { fill: var(--color-paper-2); stroke: var(--color-rule); stroke-width: 1; }
    .well { fill: var(--color-paper-3); }
    .rule { fill: none; stroke: var(--color-rule); stroke-width: 1; }
    .spine { fill: none; stroke: var(--color-rule-2); stroke-width: 1; }
    .tick { fill: none; stroke: var(--color-rule-2); stroke-width: 1; }
    .label { fill: var(--color-muted); font: 500 16px var(--font-display); }
    .stage { fill: var(--color-ink); font: 500 20px var(--font-display); }
    .num { fill: var(--color-cool); font: 500 17px var(--font-outlier); }
    .cmd { fill: var(--color-ink-2); font: 400 18px var(--font-outlier); }
    .alt { fill: var(--color-accent); font: 500 18px var(--font-outlier); }
    .note { fill: var(--color-muted); font: 400 18px var(--font-display); }
  </style>

  <rect class="ground" x="0.5" y="0.5" width="1199" height="551" rx="10"/>
  <text class="label" x="56" y="44">Step</text>
  <text class="label" x="144" y="44">Stage</text>
  <text class="label" x="480" y="44">Run</text>
  <path class="rule" d="M0 68.5H1200"/>

  <path class="spine" d="M112 68V452"/>

  <path class="tick" d="M104 108.5H120"/>
  <text class="num" x="80" y="114" text-anchor="end">1</text>
  <text class="stage" x="144" y="115">Pick up a ticket</text>
  <text class="cmd" x="480" y="115">/pstack:teach &lt;ticket&gt;</text>
  <path class="rule" d="M128 132.5H1200"/>

  <path class="tick" d="M104 172.5H120"/>
  <text class="num" x="80" y="178" text-anchor="end">2</text>
  <text class="stage" x="144" y="179">Shape a change</text>
  <text class="cmd" x="480" y="179">superpowers:brainstorming, mattpocock-skills:grilling</text>
  <path class="rule" d="M128 196.5H1200"/>

  <path class="tick" d="M104 236.5H120"/>
  <text class="num" x="80" y="242" text-anchor="end">3</text>
  <text class="stage" x="144" y="243">Build</text>
  <text class="cmd" x="480" y="243">/mattpocock-skills:tdd</text>
  <path class="rule" d="M128 260.5H1200"/>

  <path class="tick" d="M104 300.5H120"/>
  <text class="num" x="80" y="306" text-anchor="end">4</text>
  <text class="stage" x="144" y="307">Check in a browser</text>
  <text class="cmd" x="480" y="307">/e2e</text>
  <path class="rule" d="M128 324.5H1200"/>

  <path class="tick" d="M104 364.5H120"/>
  <text class="num" x="80" y="370" text-anchor="end">5</text>
  <text class="stage" x="144" y="371">Clean up the branch</text>
  <text class="cmd" x="480" y="371">/review-branch</text>
  <path class="rule" d="M128 388.5H1200"/>

  <path class="tick" d="M104 428.5H120"/>
  <text class="num" x="80" y="434" text-anchor="end">6</text>
  <text class="stage" x="144" y="435">Open the MR</text>
  <text class="cmd" x="480" y="435">/open-mr</text>

  <path class="spine" d="M1120 300.5H1136V428.5H1120"/>

  <path class="well" d="M1 476H1199V542a9 9 0 0 1-9 9H10a9 9 0 0 1-9-9Z"/>
  <path class="rule" d="M0 475.5H1200"/>
  <text class="alt" x="56" y="520">/ship-branch</text>
  <text class="note" x="216" y="520">runs steps 4 to 6 as three gated steps.</text>
</svg>
